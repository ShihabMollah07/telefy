<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Telefy.me</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B0B0F;
    color: #F5F5F7;
    font-family: system-ui, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #9A9AA8; margin: 6px 0 0; font-size: 16px; line-height: 1.5; }
  .ok { color: #3DD68C; }
  .err { color: #FF6B86; }
  .coins { color: #F5B83D; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <h1 id="greeting">স্বাগতম</h1>
    <p id="info">লোড হচ্ছে...</p>
    <p id="coins" class="coins"></p>
    <p id="status"></p>
  </div>

  <script>
    var tg = window.Telegram && window.Telegram.WebApp;
    var greeting = document.getElementById("greeting");
    var info = document.getElementById("info");
    var coins = document.getElementById("coins");
    var status = document.getElementById("status");

    function showError(message) {
      status.textContent = message;
      status.className = "err";
    }

    if (!tg || !tg.initData) {
      info.textContent = "এই পেজ Telegram-এর ভেতর থেকে খুলুন।";
    } else {
      tg.ready();
      tg.expand();

      fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tg.initData })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok) {
            info.textContent = "";
            showError(result.data.error || "কিছু একটা সমস্যা হয়েছে");
            return;
          }
          var user = result.data.user;
          greeting.textContent = "স্বাগতম, " + user.display_name + "!";
          info.textContent = "@" + user.username;
          coins.textContent = "কয়েন: " + user.coins;
          status.textContent = "আপনার অ্যাকাউন্ট তৈরি আছে।";
          status.className = "ok";
        })
        .catch(function () {
          info.textContent = "";
          showError("সার্ভারের সাথে যোগাযোগ করা যায়নি");
        });
    }
  </script>
</body>
</html>
