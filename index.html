<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Telefy.me</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<style>
  :root {
    --bg: #0B0B0F; --card: #15151B; --line: #26262F; --line2: #34343F;
    --text: #F5F5F7; --soft: #B5B5C2; --muted: #9A9AA8;
    --brand: #6B4CF0; --brand-soft: #A593FF; --gold: #F5B83D; --ok: #3DD68C; --err: #FF6B86;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Hind Siliguri', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, textarea { font-family: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 104px; }
  .center-msg { padding: 120px 24px; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.6; }
  .center-msg.err { color: var(--err); }

  /* প্রোফাইল */
  .glow { position: absolute; left: 0; top: 0; right: 0; height: 150px; pointer-events: none;
    background: radial-gradient(90% 120% at 80% 0%, rgba(107,76,240,0.45), rgba(107,76,240,0) 70%), radial-gradient(70% 100% at 0% 0%, rgba(245,184,61,0.18), rgba(245,184,61,0) 70%); }
  .topbar { position: relative; height: 56px; display: flex; align-items: center; justify-content: center; }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .head { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 24px 0; }
  .ring { width: 96px; height: 96px; border-radius: 999px; padding: 3px; background: linear-gradient(135deg, var(--brand), var(--gold)); }
  .avatar { width: 100%; height: 100%; border-radius: 999px; background: #E9DFFF; color: #2C1A6B; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 3px solid var(--bg); font-size: 38px; }
  .name { margin-top: 8px; font-size: 20px; font-weight: 700; text-align: center; word-break: break-word; }
  .bio { font-size: 14px; color: var(--soft); text-align: center; line-height: 1.5; white-space: pre-line; word-break: break-word; }
  .bio.muted { color: var(--muted); }
  .stats { position: relative; margin: 14px 16px 0; height: 64px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; text-align: center; }
  .stats div { display: flex; flex-direction: column; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats b { font-size: 18px; } .stats span { font-size: 12px; color: var(--muted); }
  .row { margin: 12px 16px 0; display: flex; gap: 10px; }
  .btn { height: 44px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn.primary { flex: 1; background: var(--brand); color: #fff; }
  .btn.ghost { width: 48px; border: 1px solid var(--line2); background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; }
  .coin-card { margin: 12px 16px 0; height: 64px; padding: 0 12px 0 14px; border-radius: 14px; background: linear-gradient(135deg, #2A2210, #1A150A); border: 1px solid #4A3B14; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .coin-card .l { display: flex; align-items: center; gap: 12px; }
  .coin-card small { display: block; font-size: 12px; color: #E8D9A8; }
  .coin-card strong { font-size: 20px; line-height: 1.2; }
  .coin-card button { height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--gold); color: #1A1200; font-size: 14px; font-weight: 700; cursor: pointer; }
  .tabs { margin-top: 12px; height: 48px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #1D1D25; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font-size: 15px; font-weight: 500; border-bottom: 3px solid transparent; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  .tabs button.on { color: #fff; font-weight: 700; border-bottom-color: var(--brand); }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.6; }

  /* ভিডিওর গ্রিড */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding-top: 2px; }
  .cell { position: relative; aspect-ratio: 9 / 16; background: var(--card); border: 0; padding: 0; overflow: hidden; color: #fff; cursor: pointer; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 6px; text-align: center; font-size: 12px; color: var(--muted); }
  .cell .ph.bad { color: var(--err); }
  .cell .dur { position: absolute; left: 6px; bottom: 6px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,0.6); font-size: 11px; font-weight: 600; }
  .spin { width: 18px; height: 18px; border-radius: 999px; border: 2px solid var(--line2); border-top-color: var(--brand-soft); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* এডিট ও আপলোড */
  .edit-top { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid #1D1D25; }
  .edit-top h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .icon-btn { width: 48px; height: 48px; border: 0; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .edit-avatar { padding: 18px 0 6px; display: flex; justify-content: center; }
  .edit-avatar .avatar { width: 88px; height: 88px; font-size: 36px; border: 0; }
  .form { padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label, .field > legend { font-size: 13px; font-weight: 600; color: var(--soft); padding: 0; }
  fieldset.field { margin: 0; border: 0; padding: 0; min-width: 0; }
  .input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 15px; padding: 0 14px; outline: none; }
  .input:focus { border-color: var(--brand); }
  textarea.input { height: 84px; padding: 10px 14px; line-height: 1.45; resize: none; }
  .at { display: flex; align-items: center; gap: 4px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 14px; }
  .at:focus-within { border-color: var(--brand); }
  .at span { color: var(--muted); }
  .at input { flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: var(--text); font-size: 15px; padding: 0; outline: none; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .count { align-self: flex-end; font-size: 12px; color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-top: 6px; }
  .seg label { height: 40px; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .seg label.on { background: var(--brand); color: #fff; font-weight: 600; }
  .seg input { width: 16px; height: 16px; margin: 0; accent-color: #fff; }
  .msg { min-height: 20px; font-size: 14px; color: var(--err); text-align: center; padding: 0 16px; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid #1D1D25; }
  .savebar .in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .save { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .save:disabled { opacity: 0.5; }
  .cancel { width: 100%; height: 44px; border: 1px solid var(--line2); border-radius: 12px; background: transparent; color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }

  .pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 170px; border: 2px dashed var(--line2); border-radius: 16px; background: var(--card); color: var(--text); cursor: pointer; text-align: center; padding: 12px; }
  .pick b { font-size: 16px; } .pick small { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .picked video { width: 100%; max-height: 320px; border-radius: 12px; background: #000; display: block; }
  .picked .meta { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
  .picked .change { border: 1px solid var(--line2); background: transparent; color: var(--text); height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; flex: none; }
  .bar { height: 8px; border-radius: 999px; background: #24242C; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--brand); transition: width 0.2s; }
  .pct { margin-top: 6px; font-size: 13px; color: var(--soft); text-align: center; }

  /* প্লেয়ার */
  .player { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .player iframe { flex: 1; width: 100%; border: 0; }
  .player .close { position: absolute; top: 10px; left: 10px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }

  /* নিচের মেনু */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; height: 80px; background: var(--bg); border-top: 1px solid #1D1D25; padding-bottom: env(safe-area-inset-bottom); }
  .nav .in { max-width: 480px; height: 80px; margin: 0 auto; display: flex; align-items: center; justify-content: space-around; padding: 0 8px 8px; }
  .nav button { border: 0; background: transparent; color: var(--muted); min-width: 56px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .nav button.on { color: #fff; font-weight: 600; }
  .nav .plus { width: 52px; height: 36px; min-width: 0; min-height: 0; border-radius: 10px; background: var(--brand); color: #fff; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #24242C; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: 90%; text-align: center; z-index: 60; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div id="state" class="center-msg">লোড হচ্ছে...</div>

  <!-- আমার প্রোফাইল -->
  <section id="view-profile" hidden>
    <div class="glow"></div>
    <div class="topbar"><h1 id="p-username"></h1></div>
    <div class="head">
      <div class="ring"><div class="avatar" id="p-avatar"></div></div>
      <div class="name" id="p-name"></div>
      <div class="bio" id="p-bio"></div>
    </div>
    <div class="stats">
      <div><b>0</b><span>অনুসরণ</span></div>
      <div><b>0</b><span>ফলোয়ার</span></div>
      <div><b>0</b><span>লাইক</span></div>
    </div>
    <div class="row">
      <button class="btn primary" id="edit-open">প্রোফাইল এডিট</button>
      <button class="btn ghost" id="share" aria-label="প্রোফাইল শেয়ার করুন">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6M12 3v12M7.5 7.5L12 3l4.5 4.5"></path></svg>
      </button>
    </div>
    <div class="coin-card">
      <div class="l">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F5B83D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"></path></svg>
        <div><small>আমার কয়েন</small><strong id="p-coins">0</strong></div>
      </div>
      <button id="buy">কয়েন কিনুন</button>
    </div>
    <div class="tabs">
      <button class="on">ভিডিও</button>
      <button id="liked-tab">পছন্দের</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="grid-empty" hidden>এখনো কোনো ভিডিও নেই।<br>নিচের + চেপে প্রথম ভিডিওটি দিন।</div>
    <div class="empty" id="grid-error" hidden style="color: var(--err)"></div>
  </section>

  <!-- প্রোফাইল এডিট -->
  <section id="view-edit" hidden>
    <div class="edit-top">
      <button class="icon-btn" id="edit-back" aria-label="পেছনে যান">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <h1>প্রোফাইল এডিট</h1>
      <div style="width: 48px"></div>
    </div>
    <div class="edit-avatar"><div class="avatar" id="e-avatar"></div></div>
    <div class="form">
      <div class="field">
        <label for="f-name">নাম</label>
        <input class="input" id="f-name" type="text" maxlength="50" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-username">ইউজারনেম</label>
        <div class="at"><span aria-hidden="true">@</span><input id="f-username" type="text" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
        <div class="hint">শুধু ইংরেজি ছোট হাতের অক্ষর (a-z), সংখ্যা ও _ ; ৩ থেকে ২৪ অক্ষর।</div>
      </div>
      <div class="field">
        <label for="f-bio">বায়ো</label>
        <textarea class="input" id="f-bio" maxlength="150"></textarea>
        <span class="count" id="bio-count">0/150</span>
      </div>
      <fieldset class="field">
        <legend>জেন্ডার</legend>
        <div class="seg" id="gender">
          <label><input type="radio" name="gender" value="male">ছেলে</label>
          <label><input type="radio" name="gender" value="female">মেয়ে</label>
          <label><input type="radio" name="gender" value="other">অন্যান্য</label>
        </div>
      </fieldset>
      <div class="field">
        <label for="f-age">বয়স</label>
        <input class="input" id="f-age" type="number" inputmode="numeric" min="13" max="99">
      </div>
      <div class="msg" id="form-msg" role="alert"></div>
    </div>
    <div class="savebar"><div class="in"><button class="save" id="save">সেভ করুন</button></div></div>
  </section>

  <!-- নতুন ভিডিও আপলোড -->
  <section id="view-upload" hidden>
    <div class="edit-top">
      <button class="icon-btn" id="upload-back" aria-label="পেছনে যান">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <h1>নতুন ভিডিও</h1>
      <div style="width: 48px"></div>
    </div>
    <div class="form" style="padding-top: 16px; padding-bottom: 150px">
      <input type="file" id="file" accept="video/*" hidden>
      <label class="pick" id="pick" for="file">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--brand-soft)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v4h16v-4M12 4v12M7 9l5-5 5 5"></path></svg>
        <b>ভিডিও বেছে নিন</b>
        <small>সর্বোচ্চ ৬০ সেকেন্ড ও ১০০ MB।<br>পোর্ট্রেট (লম্বা) ভিডিও সবচেয়ে ভালো দেখায়।</small>
      </label>
      <div class="picked" id="picked" hidden>
        <video id="preview" controls muted playsinline preload="metadata"></video>
        <div class="meta"><span id="pk-info"></span><label class="change" for="file" style="display:flex;align-items:center">ভিডিও বদলান</label></div>
      </div>
      <div class="field">
        <label for="u-caption">ক্যাপশন</label>
        <textarea class="input" id="u-caption" maxlength="150" placeholder="ভিডিওর সম্পর্কে কিছু লিখুন"></textarea>
        <span class="count" id="u-count">0/150</span>
      </div>
      <div id="progress" hidden>
        <div class="bar"><i id="bar"></i></div>
        <div class="pct" id="pct">আপলোড শুরু হচ্ছে...</div>
      </div>
      <div class="msg" id="u-msg" role="alert"></div>
    </div>
    <div class="savebar"><div class="in">
      <button class="save" id="post" disabled>পোস্ট করুন</button>
      <button class="cancel" id="cancel" hidden>আপলোড বাতিল করুন</button>
    </div></div>
  </section>

  <!-- নিচের মেনু -->
  <nav class="nav" id="nav" hidden><div class="in">
    <button data-soon>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>হোম</span>
    </button>
    <button data-soon>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg><span>ডিসকভার</span>
    </button>
    <button class="plus" id="nav-plus" aria-label="নতুন ভিডিও আপলোড">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button data-soon>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-1-1.7z"></path></svg><span>মেসেজ</span>
    </button>
    <button class="on">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>প্রোফাইল</span>
    </button>
  </div></nav>

  <!-- ভিডিও চালানোর পর্দা -->
  <div class="player" id="player" hidden>
    <button class="close" id="player-close" aria-label="বন্ধ করুন">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <iframe id="player-frame" title="ভিডিও" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  var USERNAME_RE = /^[a-z0-9_]{3,24}$/;
  var MAX_SECONDS = 60;
  var MAX_BYTES = 100 * 1024 * 1024;

  var user = null;
  var current = "profile";
  var toastTimer = null;

  // ভিডিও
  var videos = [];
  var libraryId = null;
  var loadingVideos = false;
  var pollTimer = null;
  var pollCount = 0;

  // আপলোড
  var picked = null;
  var previewUrl = null;
  var uploading = false;
  var currentUpload = null;

  function toast(message) {
    var el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function api(path, payload) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ initData: tg.initData }, payload || {}))
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  function firstChar(text) {
    var chars = Array.from(text || "");
    return chars.length ? chars[0].toUpperCase() : "?";
  }

  function fmtDuration(seconds) {
    var s = Math.round(seconds);
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }

  function playerOpen() { return !$("player").hidden; }

  function syncBackButton() {
    if (!(tg && tg.BackButton)) return;
    if (current !== "profile" || playerOpen()) { tg.BackButton.show(); } else { tg.BackButton.hide(); }
  }

  function show(name) {
    current = name;
    $("view-profile").hidden = name !== "profile";
    $("view-edit").hidden = name !== "edit";
    $("view-upload").hidden = name !== "upload";
    $("nav").hidden = name !== "profile";
    syncBackButton();
    window.scrollTo(0, 0);
  }

  function goBack() {
    if (playerOpen()) { closePlayer(); return; }
    if (current === "upload" && uploading) { toast("আপলোড চলছে, থামাতে 'আপলোড বাতিল করুন' চাপুন"); return; }
    if (current === "upload") { resetUploadForm(); }
    show("profile");
  }

  /* ---------- প্রোফাইল ---------- */

  function renderProfile() {
    $("p-username").textContent = "@" + user.username;
    $("p-avatar").textContent = firstChar(user.display_name);
    $("p-name").textContent = user.display_name;
    var bio = $("p-bio");
    if (user.bio) {
      bio.textContent = user.bio;
      bio.className = "bio";
    } else {
      bio.textContent = "বায়ো যোগ করুন";
      bio.className = "bio muted";
    }
    $("p-coins").textContent = user.coins;
  }

  function genderInputs() { return document.querySelectorAll('input[name="gender"]'); }

  function syncGender() {
    Array.prototype.forEach.call(genderInputs(), function (input) {
      input.parentNode.className = input.checked ? "on" : "";
    });
  }

  function getGender() {
    var value = null;
    Array.prototype.forEach.call(genderInputs(), function (input) { if (input.checked) value = input.value; });
    return value;
  }

  function updateBioCount() {
    $("bio-count").textContent = Array.from($("f-bio").value).length + "/150";
  }

  function setMessage(text) { $("form-msg").textContent = text || ""; }

  function openEdit() {
    $("e-avatar").textContent = firstChar(user.display_name);
    $("f-name").value = user.display_name || "";
    $("f-username").value = user.username || "";
    $("f-bio").value = user.bio || "";
    $("f-age").value = user.age == null ? "" : user.age;
    Array.prototype.forEach.call(genderInputs(), function (input) { input.checked = input.value === user.gender; });
    syncGender();
    updateBioCount();
    setMessage("");
    show("edit");
  }

  function save() {
    var name = $("f-name").value.trim();
    var username = $("f-username").value.trim().toLowerCase();
    var ageText = $("f-age").value.trim();
    var age = ageText === "" ? null : Number(ageText);

    if (!name) { setMessage("নাম লিখুন"); return; }
    if (!USERNAME_RE.test(username)) { setMessage("ইউজারনেমে শুধু ইংরেজি ছোট হাতের অক্ষর (a-z), সংখ্যা ও _ চলবে, ৩ থেকে ২৪ অক্ষর"); return; }
    if (age !== null && (!Number.isInteger(age) || age < 13 || age > 99)) { setMessage("বয়স ১৩ থেকে ৯৯ এর মধ্যে হতে হবে"); return; }

    setMessage("");
    var button = $("save");
    button.disabled = true;
    button.textContent = "সেভ হচ্ছে...";

    api("/api/profile", {
      display_name: name,
      username: username,
      bio: $("f-bio").value.trim(),
      gender: getGender(),
      age: age
    }).then(function (result) {
      if (!result.ok) {
        setMessage(result.data.error || "সেভ করা যায়নি, আবার চেষ্টা করুন");
        return;
      }
      user = result.data.user;
      renderProfile();
      show("profile");
      toast("সেভ হয়েছে");
    }).catch(function () {
      setMessage("সার্ভারের সাথে যোগাযোগ করা যায়নি");
    }).then(function () {
      button.disabled = false;
      button.textContent = "সেভ করুন";
    });
  }

  /* ---------- ভিডিওর গ্রিড ---------- */

  function hasPending() {
    return videos.some(function (v) { return v.status === "uploading" || v.status === "processing"; });
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    if (!hasPending() || current !== "profile" || pollCount >= 80) return;
    pollCount++;
    pollTimer = setTimeout(loadVideos, 6000);
  }

  function placeholder(text, bad, spinning) {
    var box = document.createElement("div");
    box.className = "ph" + (bad ? " bad" : "");
    if (spinning) {
      var spin = document.createElement("div");
      spin.className = "spin";
      box.appendChild(spin);
    }
    var label = document.createElement("span");
    label.textContent = text;
    box.appendChild(label);
    return box;
  }

  function renderGrid() {
    var grid = $("grid");
    while (grid.firstChild) { grid.removeChild(grid.firstChild); }
    $("grid-empty").hidden = videos.length > 0;
    $("grid-error").hidden = true;

    videos.forEach(function (v) {
      var cell = document.createElement("button");
      cell.className = "cell";
      cell.type = "button";

      if (v.status === "ready") {
        cell.setAttribute("aria-label", v.caption || "ভিডিও চালান");
        if (v.thumbnail) {
          var img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.src = v.thumbnail;
          img.onerror = function () {
            if (img.parentNode) { cell.removeChild(img); }
            cell.insertBefore(placeholder("ছবি আসছে...", false, true), cell.firstChild);
          };
          cell.appendChild(img);
        }
        if (v.duration) {
          var dur = document.createElement("span");
          dur.className = "dur";
          dur.textContent = fmtDuration(v.duration);
          cell.appendChild(dur);
        }
        cell.addEventListener("click", function () { openPlayer(v); });
      } else if (v.status === "failed") {
        cell.appendChild(placeholder("ব্যর্থ হয়েছে", true, false));
        cell.addEventListener("click", function () { toast("এই ভিডিওটি আপলোড বা প্রসেস করা যায়নি"); });
      } else {
        cell.appendChild(placeholder(v.status === "uploading" ? "আপলোড হচ্ছে..." : "প্রসেস হচ্ছে...", false, true));
        cell.addEventListener("click", function () { toast("ভিডিও প্রসেস হচ্ছে, একটু অপেক্ষা করুন"); });
      }
      grid.appendChild(cell);
    });
  }

  function loadVideos() {
    if (loadingVideos) return;
    loadingVideos = true;
    api("/api/videos", { action: "mine" }).then(function (result) {
      loadingVideos = false;
      if (!result.ok) {
        $("grid-error").textContent = result.data.error || "ভিডিওর তালিকা আনা যায়নি";
        $("grid-error").hidden = false;
        return;
      }
      libraryId = result.data.libraryId;
      videos = result.data.videos || [];
      renderGrid();
      schedulePoll();
    }).catch(function () {
      loadingVideos = false;
    });
  }

  function openPlayer(v) {
    if (!/^[0-9a-fA-F-]{36}$/.test(String(v.video_id)) || !/^\d+$/.test(String(libraryId))) { return; }
    $("player-frame").src = "https://player.mediadelivery.net/embed/" + libraryId + "/" + v.video_id + "?autoplay=true&loop=true&preload=true";
    $("player").hidden = false;
    syncBackButton();
  }

  function closePlayer() {
    $("player-frame").src = "about:blank";
    $("player").hidden = true;
    syncBackButton();
  }

  /* ---------- ভিডিও আপলোড ---------- */

  function setUploadMsg(text) { $("u-msg").textContent = text || ""; }

  function setProgress(percent, label) {
    $("bar").style.width = percent + "%";
    $("pct").textContent = label || ("আপলোড হচ্ছে: " + percent + "%");
  }

  function resetUploadForm() {
    picked = null;
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    var video = $("preview");
    video.removeAttribute("src");
    video.load();
    $("file").value = "";
    $("picked").hidden = true;
    $("pick").hidden = false;
    $("u-caption").value = "";
    $("u-count").textContent = "0/150";
    $("progress").hidden = true;
    $("bar").style.width = "0";
    $("post").disabled = true;
    $("post").textContent = "পোস্ট করুন";
    $("cancel").hidden = true;
    setUploadMsg("");
  }

  function openUpload() {
    resetUploadForm();
    show("upload");
  }

  function onFilePicked() {
    var input = $("file");
    var file = input.files && input.files[0];
    if (!file || uploading) { return; }

    setUploadMsg("");
    var looksLikeVideo = /^video\//.test(file.type) || /\.(mp4|mov|m4v|webm|mkv|3gp)$/i.test(file.name);
    if (!looksLikeVideo) { setUploadMsg("শুধু ভিডিও ফাইল বাছুন"); input.value = ""; return; }
    if (file.size > MAX_BYTES) { setUploadMsg("ভিডিও ১০০ MB-এর বেশি বড়, ছোট ভিডিও বাছুন"); input.value = ""; return; }

    if (previewUrl) { URL.revokeObjectURL(previewUrl); }
    previewUrl = URL.createObjectURL(file);
    picked = { file: file, duration: null };

    var sizeText = (file.size / 1048576).toFixed(1) + " MB";
    var video = $("preview");
    $("post").disabled = true;
    $("pick").hidden = true;
    $("picked").hidden = false;
    $("pk-info").textContent = "পরীক্ষা হচ্ছে... · " + sizeText;

    video.onloadedmetadata = function () {
      var duration = video.duration;
      if (isFinite(duration) && duration > MAX_SECONDS + 0.5) {
        setUploadMsg("ভিডিও " + MAX_SECONDS + " সেকেন্ডের বেশি লম্বা (" + fmtDuration(duration) + "), ছোট ভিডিও বাছুন");
        $("pk-info").textContent = fmtDuration(duration) + " · " + sizeText;
        picked = null;
        input.value = "";
        return;
      }
      picked.duration = isFinite(duration) ? duration : null;
      $("pk-info").textContent = (picked.duration ? fmtDuration(picked.duration) + " · " : "") + sizeText;
      $("post").disabled = false;
    };
    video.onerror = function () {
      // কিছু ফোনের ভিডিও ব্রাউজারে প্রিভিউ হয় না। সার্ভার পরে নিজেই দৈর্ঘ্য যাচাই করবে
      if (!picked) { return; }
      $("pk-info").textContent = "প্রিভিউ দেখানো যাচ্ছে না · " + sizeText;
      $("post").disabled = false;
    };
    video.src = previewUrl;
    input.value = "";
  }

  function finishUpload(success, message) {
    uploading = false;
    currentUpload = null;
    $("cancel").hidden = true;
    $("post").textContent = "পোস্ট করুন";
    if (success) {
      resetUploadForm();
      show("profile");
      pollCount = 0;
      loadVideos();
      toast("ভিডিও আপলোড হয়েছে, প্রসেস হচ্ছে");
    } else {
      $("post").disabled = !picked;
      $("progress").hidden = true;
      setUploadMsg(message || "আপলোড করা যায়নি, আবার চেষ্টা করুন");
    }
  }

  function startUpload() {
    if (!picked || uploading) { return; }
    if (!window.tus) { setUploadMsg("আপলোডের টুল লোড হয়নি, ইন্টারনেট দেখে অ্যাপটি আবার খুলুন"); return; }

    uploading = true;
    setUploadMsg("");
    $("post").disabled = true;
    $("post").textContent = "আপলোড হচ্ছে...";
    $("cancel").hidden = false;
    $("progress").hidden = false;
    setProgress(0, "প্রস্তুত হচ্ছে...");

    api("/api/video-create", { caption: $("u-caption").value.trim() }).then(function (result) {
      if (!result.ok) { throw new Error(result.data.error || "আপলোড শুরু করা যায়নি"); }
      var up = result.data.upload;
      var file = picked.file;
      var upload = new window.tus.Upload(file, {
        endpoint: up.endpoint,
        retryDelays: [0, 3000, 5000, 10000, 20000, 60000],
        storeFingerprintForResuming: false,
        headers: {
          AuthorizationSignature: up.signature,
          AuthorizationExpire: String(up.expire),
          VideoId: up.videoId,
          LibraryId: String(up.libraryId)
        },
        metadata: { filetype: file.type || "video/mp4", title: "Telefy video" },
        onProgress: function (sent, total) { setProgress(Math.round((sent / total) * 100)); },
        onError: function () { finishUpload(false, "আপলোড ব্যর্থ হয়েছে, নেটওয়ার্ক দেখে আবার চেষ্টা করুন"); },
        onSuccess: function () { finishUpload(true); }
      });
      currentUpload = upload;
      upload.start();
    }).catch(function (error) {
      finishUpload(false, error && error.message ? error.message : "সার্ভারের সাথে যোগাযোগ করা যায়নি");
    });
  }

  function cancelUpload() {
    if (!uploading) { return; }
    var upload = currentUpload;
    if (upload) {
      try { upload.abort(); } catch (e) { /* কিছু করার নেই */ }
    }
    finishUpload(false, "আপলোড বাতিল করা হয়েছে");
  }

  /* ---------- শুরু ---------- */

  function soon() { toast("এই সুবিধা শীঘ্রই আসছে"); }

  function bind() {
    $("edit-open").addEventListener("click", openEdit);
    $("edit-back").addEventListener("click", goBack);
    $("upload-back").addEventListener("click", goBack);
    $("save").addEventListener("click", save);
    $("f-bio").addEventListener("input", updateBioCount);
    Array.prototype.forEach.call(genderInputs(), function (input) { input.addEventListener("change", syncGender); });
    ["share", "buy", "liked-tab"].forEach(function (id) { $(id).addEventListener("click", soon); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-soon]"), function (el) { el.addEventListener("click", soon); });

    $("nav-plus").addEventListener("click", openUpload);
    $("file").addEventListener("change", onFilePicked);
    $("post").addEventListener("click", startUpload);
    $("cancel").addEventListener("click", cancelUpload);
    $("u-caption").addEventListener("input", function () {
      $("u-count").textContent = Array.from($("u-caption").value).length + "/150";
    });
    $("player-close").addEventListener("click", closePlayer);

    if (tg && tg.BackButton && tg.BackButton.onClick) { tg.BackButton.onClick(goBack); }
  }

  function fail(message) {
    var state = $("state");
    state.textContent = message;
    state.className = "center-msg err";
  }

  if (!tg || !tg.initData) {
    $("state").textContent = "এই পেজ Telegram-এর ভেতর থেকে খুলুন।";
    return;
  }

  tg.ready();
  tg.expand();
  bind();

  api("/api/auth", {}).then(function (result) {
    if (!result.ok) { fail(result.data.error || "কিছু একটা সমস্যা হয়েছে"); return; }
    user = result.data.user;
    $("state").hidden = true;
    renderProfile();
    show("profile");
    loadVideos();
  }).catch(function () {
    fail("সার্ভারের সাথে যোগাযোগ করা যায়নি");
  });
})();
</script>
</body>
</html>
